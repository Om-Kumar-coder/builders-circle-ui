# Scoring Engine Benchmarks
#
# Runs the scoring performance benchmark suite on pull requests that affect
# scoring-related files, and posts the timing results as a PR comment.
# Also supports manual triggers via the GitHub UI ("Run workflow").

name: Scoring Engine Benchmarks

on:
  pull_request:
    paths:
      - 'backend/src/services/scoring/**'
      - 'backend/src/__tests__/scoring-performance.test.ts'
      - 'backend/src/__tests__/application-scoring.test.ts'
      - 'backend/src/jobs/tierEvaluationJob.ts'
      - 'backend/package.json'
      - 'backend/jest.config.js'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run scoring performance benchmarks
        id: bench
        run: |
          mkdir -p /tmp/bench
          npx jest --no-coverage --testPathPatterns scoring-performance 2>&1 | tee /tmp/bench/output.txt
        # The --silent flag is intentionally omitted so console.log timing lines
        # are captured in the output for the PR comment below.

      - name: Post benchmark results as PR comment
        uses: actions/github-script@v7
        # Only post on pull_request events (not workflow_dispatch)
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/bench/output.txt', 'utf8');
            const lines = output.split('\n');

            // ── Extract timing lines ──────────────────────────────────────────
            // Test console.log lines are indented with 2+ spaces (jest reporter).
            // Scoring engine info logs begin with "info:" — excluded by this grep.
            const timingLines = lines.filter(l => /^\s{2}[a-zA-Z]/.test(l));

            // ── Extract pass/fail summary ─────────────────────────────────────
            const summaryLines = lines.filter(l =>
              /^(Tests:|Suites:|PASS |FAIL )/.test(l)
            );

            // ── Determine overall status ──────────────────────────────────────
            const hasFailure = /FAIL/m.test(output);
            const header = hasFailure
              ? '❌ **Scoring Engine Benchmarks — Some Tests Failed**'
              : '✅ **Scoring Engine Benchmarks — All Tests Passed**';

            // ── Build comment body ────────────────────────────────────────────
            const body = `${header}

            <details>
            <summary>📊 Benchmark Timing Results</summary>

            \`\`\`
            ${timingLines.join('\n') || '(no timing lines captured)'}
            \`\`\`
            </details>

            <details>
            <summary>📋 Test Summary</summary>

            \`\`\`
            ${summaryLines.join('\n') || '(no summary captured)'}
            \`\`\`
            </details>

            _Generated by the Scoring Benchmarks workflow — run ID: ${context.runId}_`;

            // ── Find & update existing bot comment, or create a new one ───────
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body && c.body.includes('Scoring Engine Benchmarks')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            }
